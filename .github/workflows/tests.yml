name: Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: api
        type: choice
        options:
          - api
          - ui
          - e2e
          - smoke
          - regression
          - all
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.parallel=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve suite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SUITE=${{ inputs.suite }}" >> "$GITHUB_ENV"
          else
            echo "SUITE=api" >> "$GITHUB_ENV"
          fi

      - name: Install Playwright (browsers and OS deps)
        if: env.SUITE == 'ui' || env.SUITE == 'e2e' || env.SUITE == 'smoke' || env.SUITE == 'regression' || env.SUITE == 'all'
        run: |
          chmod +x gradlew
          ./gradlew playwrightInstall --no-daemon --no-build-cache
          sudo -E env "GRADLE_USER_HOME=$GRADLE_USER_HOME" ./gradlew playwrightInstallDeps --no-daemon --no-build-cache

      - name: Run tests and generate Allure report
        id: tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          GRADLE_PROPS="-Dreporting.onFailure=false -Dui.headless=true"
          GRADLE_FLAGS="--no-daemon --no-build-cache"
          case "$SUITE" in
            api)        ./gradlew apiTest allureReport $GRADLE_PROPS $GRADLE_FLAGS ;;
            ui)         ./gradlew uiTest allureReport $GRADLE_PROPS $GRADLE_FLAGS ;;
            e2e)        ./gradlew e2eTest allureReport $GRADLE_PROPS $GRADLE_FLAGS ;;
            smoke)      ./gradlew smokeTest allureReport $GRADLE_PROPS $GRADLE_FLAGS ;;
            regression) ./gradlew regressionTest allureReport $GRADLE_PROPS $GRADLE_FLAGS ;;
            all)        ./gradlew test allureReport $GRADLE_PROPS $GRADLE_FLAGS ;;
            *)          echo "Unknown suite: $SUITE" && exit 1 ;;
          esac

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
          check_name: Test results (${{ env.SUITE }})
          comment_mode: off

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy-allure:
    needs: test
    if: always() && needs.test.result != 'cancelled' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
